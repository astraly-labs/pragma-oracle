name: Run scripts

on: pull_request

env:
  # starknet-py 0.27 (pinned by pragma-sdk) speaks JSON-RPC 0.8.
  # Devnet 0.4.x is the last line serving RPC 0.8; 0.5+ only serves 0.9+.
  DEVNET_VERSION: v0.4.4

jobs:
  run_scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pragma-deployer
    steps:
      - uses: actions/checkout@v4

      - name: Install Starknet Devnet
        run: |
          wget -q "https://github.com/starknet-io/starknet-devnet/releases/download/${DEVNET_VERSION}/starknet-devnet-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf starknet-devnet-x86_64-unknown-linux-gnu.tar.gz
          sudo install -m 755 starknet-devnet /usr/local/bin/starknet-devnet
          rm -f starknet-devnet-x86_64-unknown-linux-gnu.tar.gz
          starknet-devnet --version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Scarb
        uses: software-mansion/setup-scarb@v1

      - name: Build with Scarb
        run: scarb build
        working-directory: pragma-oracle

      - name: Run Starknet Devnet and scripts
        run: bash scripts/devnet.sh
